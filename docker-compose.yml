# Base PostgreSQL pour le développement local : `docker compose up -d`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gestion_om
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gestion_om
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres-data:
